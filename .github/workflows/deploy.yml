name: Deploy WordPress Site

on:
  push:
    branches:
      - production
      # - staging
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select deployment target from branch
        shell: bash
        run: |
          set -e

          if [[ "${GITHUB_REF_NAME}" == "production" ]]; then
            echo "DEPLOY_HOST=${{ secrets.PROD_HOST }}" >> "$GITHUB_ENV"
            echo "DEPLOY_USER=${{ secrets.PROD_USER }}" >> "$GITHUB_ENV"
            echo "DEPLOY_PORT=${PROD_PORT:-22}" >> "$GITHUB_ENV"
            echo "DEPLOY_PATH=${{ secrets.PROD_PATH }}" >> "$GITHUB_ENV"
            echo "DEPLOY_ENV=production" >> "$GITHUB_ENV"
          elif [[ "${GITHUB_REF_NAME}" == "staging" ]]; then
            echo "DEPLOY_HOST=${{ secrets.STAGE_HOST }}" >> "$GITHUB_ENV"
            echo "DEPLOY_USER=${{ secrets.STAGE_USER }}" >> "$GITHUB_ENV"
            echo "DEPLOY_PORT=${STAGE_PORT:-22}" >> "$GITHUB_ENV"
            echo "DEPLOY_PATH=${{ secrets.STAGE_PATH }}" >> "$GITHUB_ENV"
            echo "DEPLOY_ENV=staging" >> "$GITHUB_ENV"
          else
            echo "Unsupported branch ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
        env:
          PROD_PORT: ${{ secrets.PROD_PORT }}
          STAGE_PORT: ${{ secrets.STAGE_PORT }}

      - name: Validate required deployment values
        shell: bash
        run: |
          set -e
          missing=()
          [[ -z "$DEPLOY_HOST" ]] && missing+=("host")
          [[ -z "$DEPLOY_USER" ]] && missing+=("user")
          [[ -z "$DEPLOY_PATH" ]] && missing+=("path")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing deployment secrets for branch ${GITHUB_REF_NAME}: ${missing[*]}" >&2
            echo "Set branch-specific secrets in GitHub Actions secrets." >&2
            exit 1
          fi

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ github.ref_name == 'production' && secrets.PROD_SSH_KEY || secrets.STAGE_SSH_KEY }}

      - name: Add server to known hosts
        shell: bash
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Ensure target directory exists
        shell: bash
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"

      # DEPLOY_USER must be the actual file owner (e.g. eppweb), so synced
      # files land with correct ownership and no sudo/chown is ever needed.
      #
      # --delete is scoped to what's in this repo. wp-config.php, uploads/,
      # upgrade/, cache/, and node_modules/dist are excluded so rsync never
      # deletes them even though they don't exist in the git checkout —
      # they're server-only and persist across deploys.
      - name: Sync files to server
        shell: bash
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude '.DS_Store' \
            --exclude 'node_modules/' \
            --exclude 'wp-config.php' \
            --exclude 'wp-content/uploads/' \
            --exclude 'wp-content/upgrade/' \
            --exclude 'wp-content/cache/' \
            --exclude '*/node_modules/' \
            --exclude 'router.php' \
            -e "ssh -p $DEPLOY_PORT" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      # Only creates wp-config.php if it's genuinely missing (fresh site).
      # On existing sites this is a no-op — it never overwrites a live config.
      - name: Ensure wp-config.php exists
        shell: bash
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "
            set -e
            cd '$DEPLOY_PATH'
            if [ ! -f wp-config.php ]; then
              wp config create \
                --dbname='${{ secrets.DEPLOY_DB_NAME }}' \
                --dbuser='${{ secrets.DEPLOY_DB_USER }}' \
                --dbpass='${{ secrets.DEPLOY_DB_PASS }}' \
                --dbhost='${{ secrets.DEPLOY_DB_HOST }}' \
                --skip-check
              echo 'wp-config.php created — new site, verify DB connection manually.'
            fi
          "

      - name: Validate PHP syntax on server
        shell: bash
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "
            set -e
            cd '$DEPLOY_PATH'
            find wp-content -name '*.php' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 php -l
          "

      # Clears cache and permalink rules so newly-deployed code takes effect.
      # Does not require sudo, so it runs safely in this non-interactive shell.
      - name: Flush caches
        shell: bash
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "
            set -e
            cd '$DEPLOY_PATH'
            wp cache flush || true
            wp rewrite flush --hard || true
          "

      - name: Deployment summary
        run: |
          echo "Deployment completed for ${GITHUB_REF_NAME}."
          echo "Target: $DEPLOY_ENV"
          echo "Host: $DEPLOY_HOST"
          echo "Path: $DEPLOY_PATH"
