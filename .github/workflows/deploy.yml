name: Deploy WordPress Site

on:
  push:
    branches:
      - production
      # - staging
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select deployment target from branch
        shell: bash
        run: |
          set -e

          if [[ "${GITHUB_REF_NAME}" == "production" ]]; then
            echo "DEPLOY_HOST=${{ secrets.PROD_HOST }}" >> "$GITHUB_ENV"
            echo "DEPLOY_USER=${{ secrets.PROD_USER }}" >> "$GITHUB_ENV"
            echo "DEPLOY_PORT=${PROD_PORT:-22}" >> "$GITHUB_ENV"
            echo "DEPLOY_PATH=${{ secrets.PROD_PATH }}" >> "$GITHUB_ENV"
            echo "DEPLOY_ENV=production" >> "$GITHUB_ENV"
          elif [[ "${GITHUB_REF_NAME}" == "staging" ]]; then
            echo "DEPLOY_HOST=${{ secrets.STAGE_HOST }}" >> "$GITHUB_ENV"
            echo "DEPLOY_USER=${{ secrets.STAGE_USER }}" >> "$GITHUB_ENV"
            echo "DEPLOY_PORT=${STAGE_PORT:-22}" >> "$GITHUB_ENV"
            echo "DEPLOY_PATH=${{ secrets.STAGE_PATH }}" >> "$GITHUB_ENV"
            echo "DEPLOY_ENV=staging" >> "$GITHUB_ENV"
          else
            echo "Unsupported branch ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
        env:
          PROD_PORT: ${{ secrets.PROD_PORT }}
          STAGE_PORT: ${{ secrets.STAGE_PORT }}

      - name: Validate required deployment values
        shell: bash
        run: |
          set -e
          missing=()
          [[ -z "$DEPLOY_HOST" ]] && missing+=("host")
          [[ -z "$DEPLOY_USER" ]] && missing+=("user")
          [[ -z "$DEPLOY_PATH" ]] && missing+=("path")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing deployment secrets for branch ${GITHUB_REF_NAME}: ${missing[*]}" >&2
            echo "Set branch-specific secrets in GitHub Actions secrets." >&2
            exit 1
          fi

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ github.ref_name == 'production' && secrets.PROD_SSH_KEY || secrets.STAGE_SSH_KEY }}

      - name: Add server to known hosts
        shell: bash
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Ensure target directory exists
        shell: bash
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"

      # IMPORTANT: this only syncs wp-content/ (themes, plugins, mu-plugins).
      # WordPress core (wp-admin/, wp-includes/, wp-*.php, index.php, wp-config.php)
      # is intentionally NOT touched here — it's managed on the server via wp-cli
      # (wp core update / wp plugin update from the .org repo), matching .gitignore.
      # Syncing the whole repo root with --delete would wipe those files since
      # they don't exist in this git checkout.
      - name: Sync wp-content to server
        shell: bash
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude '.DS_Store' \
            --exclude 'node_modules/' \
            --exclude 'wp-content/uploads/' \
            --exclude 'wp-content/upgrade/' \
            --exclude 'wp-content/cache/' \
            --exclude '*/node_modules/' \
            --exclude '*/assets/dist/' \
            --exclude 'router.php' \
            -e "ssh -p $DEPLOY_PORT" \
            ./wp-content/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/wp-content/"

      # DEPLOY_USER must be the actual owner of the document root (e.g. eppweb),
      # not just any SSH user — that way rsync-written files already have the
      # correct owner and no sudo/chown step is needed (sudo can't prompt for
      # a password in a non-interactive CI SSH session, which is what failed
      # here previously).
      - name: Validate PHP syntax on server
        shell: bash
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "
            set -e
            cd '$DEPLOY_PATH'
            find wp-content -name '*.php' -print0 | xargs -0 -n1 php -l
          "

      - name: Deployment summary
        run: |
          echo "Deployment completed for ${GITHUB_REF_NAME}."
          echo "Target: $DEPLOY_ENV"
          echo "Host: $DEPLOY_HOST"
          echo "Path: $DEPLOY_PATH"
