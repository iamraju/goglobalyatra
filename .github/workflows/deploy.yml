name: Deploy PHP Site

on:
  push:
    branches:
      - production
      # - staging
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select deployment target from branch
        shell: bash
        run: |
          set -e

          if [[ "${GITHUB_REF_NAME}" == "production" ]]; then
            echo "DEPLOY_HOST=${{ secrets.PROD_HOST }}" >> "$GITHUB_ENV"
            echo "DEPLOY_USER=${{ secrets.PROD_USER }}" >> "$GITHUB_ENV"
            echo "DEPLOY_PORT=${PROD_PORT:-22}" >> "$GITHUB_ENV"
            echo "DEPLOY_PATH=${{ secrets.PROD_PATH }}" >> "$GITHUB_ENV"
            echo "DEPLOY_ENV=production" >> "$GITHUB_ENV"
          elif [[ "${GITHUB_REF_NAME}" == "staging" ]]; then
            echo "DEPLOY_HOST=${{ secrets.STAGE_HOST }}" >> "$GITHUB_ENV"
            echo "DEPLOY_USER=${{ secrets.STAGE_USER }}" >> "$GITHUB_ENV"
            echo "DEPLOY_PORT=${STAGE_PORT:-22}" >> "$GITHUB_ENV"
            echo "DEPLOY_PATH=${{ secrets.STAGE_PATH }}" >> "$GITHUB_ENV"
            echo "DEPLOY_ENV=staging" >> "$GITHUB_ENV"
          else
            echo "Unsupported branch ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
        env:
          PROD_PORT: ${{ secrets.PROD_PORT }}
          STAGE_PORT: ${{ secrets.STAGE_PORT }}

      - name: Validate required deployment values
        shell: bash
        run: |
          set -e
          missing=()
          [[ -z "$DEPLOY_HOST" ]] && missing+=("host")
          [[ -z "$DEPLOY_USER" ]] && missing+=("user")
          [[ -z "$DEPLOY_PATH" ]] && missing+=("path")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing deployment secrets for branch ${GITHUB_REF_NAME}: ${missing[*]}" >&2
            echo "Set branch-specific secrets in GitHub Actions secrets." >&2
            exit 1
          fi

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ github.ref_name == 'production' && secrets.PROD_SSH_KEY || secrets.STAGE_SSH_KEY }}

      - name: Add server to known hosts
        shell: bash
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Ensure target directory exists
        shell: bash
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"

      - name: Sync files to server
        shell: bash
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude 'vendor/' \
            --exclude '.DS_Store' \
            -e "ssh -p $DEPLOY_PORT" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Install dependencies and validate on server
        shell: bash
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "
            set -e
            cd '$DEPLOY_PATH'

            if [ ! -f .env ]; then
              cp .env.example .env
              echo '.env was created from .env.example. Update it on server.'
            fi

            if ! command -v composer >/dev/null 2>&1; then
              echo 'composer is not installed on server.' >&2
              exit 1
            fi

            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
            php -l index.php >/dev/null
          "

      - name: Deployment summary
        run: |
          echo "Deployment completed for ${GITHUB_REF_NAME}."
          echo "Target: $DEPLOY_ENV"
          echo "Host: $DEPLOY_HOST"
          echo "Path: $DEPLOY_PATH"
